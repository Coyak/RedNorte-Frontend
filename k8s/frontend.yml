apiVersion: v1
kind: Service
metadata:
  name: rednorte-frontend
  labels:
    app: rednorte-frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: rednorte-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rednorte-frontend
  labels:
    app: rednorte-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rednorte-frontend
  template:
    metadata:
      labels:
        app: rednorte-frontend
    spec:
      containers:
        - name: frontend
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/rednorte-frontend:REPLACE_TAG
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
